<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f4f2fb;font-family:Inter,Arial,sans-serif}
.wrap{display:flex;gap:8px;padding:24px 24px 8px}
.cell{width:220px;text-align:center}
.cell div{font-size:15px;color:#3b3a5c;font-weight:600;margin-top:4px}
h1{font-size:22px;margin:20px 24px 0;color:#2b2a4c}
p{margin:4px 24px 0;color:#5b5a7c;font-size:14px}
</style></head><body>
<h1>Nib, the default desktop pet</h1>
<p>Original mascot: a pocket-sized cyber sprite with a glowing face screen, a rainbow antenna tuft and oversized headphones.</p>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="tuft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3d9"/><stop offset=".5" stop-color="#a8d8ff"/><stop offset="1" stop-color="#fff2a8"/></linearGradient>
<linearGradient id="bod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3b6b"/><stop offset="1" stop-color="#25244a"/></linearGradient>
<g id="feet"><ellipse cx="78" cy="188" rx="15" ry="8" fill="#1a1933"/><ellipse cx="122" cy="188" rx="15" ry="8" fill="#1a1933"/></g>
<g id="body">
 <path d="M100 66 C 96 40, 112 30, 124 26 C 116 38, 118 48, 106 66 Z" fill="url(#tuft)" stroke="#15142a" stroke-width="3"/>
 <ellipse cx="100" cy="128" rx="60" ry="60" fill="url(#bod)" stroke="#15142a" stroke-width="4"/>
 <path d="M48 118 C 50 62, 150 62, 152 118" fill="none" stroke="#15142a" stroke-width="8" stroke-linecap="round"/>
 <path d="M48 118 C 50 62, 150 62, 152 118" fill="none" stroke="#ff4d6d" stroke-width="4" stroke-linecap="round"/>
 <rect x="32" y="106" width="22" height="40" rx="10" fill="#ff4d6d" stroke="#15142a" stroke-width="3"/>
 <rect x="146" y="106" width="22" height="40" rx="10" fill="#ff4d6d" stroke="#15142a" stroke-width="3"/>
 <rect x="64" y="100" width="72" height="50" rx="22" fill="#0e1830" stroke="#15142a" stroke-width="3"/>
 <circle cx="70" cy="156" r="6" fill="#ff8fb1" opacity=".7"/><circle cx="130" cy="156" r="6" fill="#ff8fb1" opacity=".7"/>
</g>
<g id="eyes-open"><rect x="81" y="112" width="12" height="22" rx="6" fill="#7ff3ff"/><rect x="107" y="112" width="12" height="22" rx="6" fill="#7ff3ff"/><circle cx="90" cy="117" r="2.5" fill="#fff"/><circle cx="116" cy="117" r="2.5" fill="#fff"/></g>
<g id="eyes-happy"><path d="M80 128 Q87 114 94 128" fill="none" stroke="#7ff3ff" stroke-width="5" stroke-linecap="round"/><path d="M106 128 Q113 114 120 128" fill="none" stroke="#7ff3ff" stroke-width="5" stroke-linecap="round"/></g>
<g id="eyes-closed"><path d="M80 124 Q87 132 94 124" fill="none" stroke="#7ff3ff" stroke-width="4" stroke-linecap="round"/><path d="M106 124 Q113 132 120 124" fill="none" stroke="#7ff3ff" stroke-width="4" stroke-linecap="round"/></g>
</defs></svg>
<div class="wrap">
<div class="cell"><svg viewBox="0 0 200 230" width="200" height="230"><g transform="translate(0,20)"><use href="#feet"/><ellipse cx="42" cy="150" rx="10" ry="14" fill="#2b2a50" stroke="#15142a" stroke-width="3"/><ellipse cx="158" cy="150" rx="10" ry="14" fill="#2b2a50" stroke="#15142a" stroke-width="3"/><use href="#body"/><use href="#eyes-open"/></g></svg><div>Idle</div></div>
<div class="cell"><svg viewBox="0 0 200 230" width="200" height="230"><g transform="translate(0,34) translate(100,190) scale(1.04,0.92) translate(-100,-190)"><ellipse cx="72" cy="186" rx="18" ry="9" fill="#1a1933"/><ellipse cx="128" cy="186" rx="18" ry="9" fill="#1a1933"/><use href="#body"/><use href="#eyes-happy"/><ellipse cx="62" cy="170" rx="12" ry="9" fill="#2b2a50" stroke="#15142a" stroke-width="3"/><ellipse cx="138" cy="170" rx="12" ry="9" fill="#2b2a50" stroke="#15142a" stroke-width="3"/></g></svg><div>Sit</div></div>
<div class="cell"><svg viewBox="0 0 200 230" width="200" height="230"><g transform="translate(0,18) rotate(8 100 190) translate(100,190) scale(1.06,0.88) translate(-100,-190)"><use href="#feet"/><use href="#body"/><use href="#eyes-closed"/></g><text x="148" y="54" font-size="22" font-weight="700" fill="#7c7aa8">z</text><text x="162" y="34" font-size="30" font-weight="700" fill="#7c7aa8">Z</text></svg><div>Sleep</div></div>
<div class="cell"><svg viewBox="0 0 200 230" width="200" height="230"><g transform="translate(0,22) rotate(-10 100 190)"><use href="#feet"/><ellipse cx="38" cy="96" rx="10" ry="15" transform="rotate(-30 38 96)" fill="#2b2a50" stroke="#15142a" stroke-width="3"/><ellipse cx="160" cy="152" rx="10" ry="14" fill="#2b2a50" stroke="#15142a" stroke-width="3"/><use href="#body"/><use href="#eyes-happy"/><path d="M92 140 Q100 148 108 140" fill="none" stroke="#7ff3ff" stroke-width="3" stroke-linecap="round"/></g><text x="150" y="60" font-size="28" fill="#ff4d6d">&#9834;</text><text x="16" y="44" font-size="22" fill="#5aa8ff">&#9835;</text></svg><div>Dance</div></div>
<div class="cell"><svg viewBox="0 0 200 230" width="200" height="230"><rect x="6" y="4" width="188" height="56" rx="16" fill="#fff" stroke="#3b3a5c" stroke-width="2.5"/><path d="M92 59 L100 72 L108 59 Z" fill="#fff" stroke="#3b3a5c" stroke-width="2.5"/><rect x="93" y="56" width="14" height="5" fill="#fff"/><text x="18" y="27" font-size="12" font-weight="700" fill="#5aa8ff">Discord</text><text x="18" y="46" font-size="13" fill="#2b2a4c">sam: you up for tonight?</text><g transform="translate(25,92) scale(.75)"><use href="#feet"/><use href="#body"/><use href="#eyes-open"/></g></svg><div>Notification bubble</div></div>
</div></body></html>
