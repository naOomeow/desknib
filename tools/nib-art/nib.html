<!doctype html>
<!-- Source art for Nib. render.sh screenshots one animation strip at a time:
     nib.html?anim=idle renders that strip on a transparent background. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden}
#strip{display:flex}
svg.frame{display:block;width:160px;height:184px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="tuft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3d9"/><stop offset=".5" stop-color="#a8d8ff"/><stop offset="1" stop-color="#fff2a8"/></linearGradient>
<linearGradient id="bod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3b6b"/><stop offset="1" stop-color="#25244a"/></linearGradient>
<g id="feet"><ellipse cx="78" cy="188" rx="15" ry="8" fill="#1a1933"/><ellipse cx="122" cy="188" rx="15" ry="8" fill="#1a1933"/></g>
<g id="sitfeet"><ellipse cx="72" cy="186" rx="18" ry="9" fill="#1a1933"/><ellipse cx="128" cy="186" rx="18" ry="9" fill="#1a1933"/></g>
<g id="arms"><ellipse cx="42" cy="150" rx="10" ry="14" fill="#2b2a50" stroke="#15142a" stroke-width="3"/><ellipse cx="158" cy="150" rx="10" ry="14" fill="#2b2a50" stroke="#15142a" stroke-width="3"/></g>
<g id="body">
 <path d="M100 66 C 96 40, 112 30, 124 26 C 116 38, 118 48, 106 66 Z" fill="url(#tuft)" stroke="#15142a" stroke-width="3"/>
 <ellipse cx="100" cy="128" rx="60" ry="60" fill="url(#bod)" stroke="#15142a" stroke-width="4"/>
 <path d="M48 118 C 50 62, 150 62, 152 118" fill="none" stroke="#15142a" stroke-width="8" stroke-linecap="round"/>
 <path d="M48 118 C 50 62, 150 62, 152 118" fill="none" stroke="#ff4d6d" stroke-width="4" stroke-linecap="round"/>
 <rect x="32" y="106" width="22" height="40" rx="10" fill="#ff4d6d" stroke="#15142a" stroke-width="3"/>
 <rect x="146" y="106" width="22" height="40" rx="10" fill="#ff4d6d" stroke="#15142a" stroke-width="3"/>
 <rect x="64" y="100" width="72" height="50" rx="22" fill="#0e1830" stroke="#15142a" stroke-width="3"/>
 <circle cx="70" cy="156" r="6" fill="#ff8fb1" opacity=".7"/><circle cx="130" cy="156" r="6" fill="#ff8fb1" opacity=".7"/>
</g>
<g id="eyes-open"><rect x="81" y="112" width="12" height="22" rx="6" fill="#7ff3ff"/><rect x="107" y="112" width="12" height="22" rx="6" fill="#7ff3ff"/><circle cx="90" cy="117" r="2.5" fill="#fff"/><circle cx="116" cy="117" r="2.5" fill="#fff"/></g>
<g id="eyes-blink"><rect x="80" y="122" width="14" height="4" rx="2" fill="#7ff3ff"/><rect x="106" y="122" width="14" height="4" rx="2" fill="#7ff3ff"/></g>
<g id="eyes-happy"><path d="M80 128 Q87 114 94 128" fill="none" stroke="#7ff3ff" stroke-width="5" stroke-linecap="round"/><path d="M106 128 Q113 114 120 128" fill="none" stroke="#7ff3ff" stroke-width="5" stroke-linecap="round"/></g>
<g id="eyes-closed"><path d="M80 124 Q87 132 94 124" fill="none" stroke="#7ff3ff" stroke-width="4" stroke-linecap="round"/><path d="M106 124 Q113 132 120 124" fill="none" stroke="#7ff3ff" stroke-width="4" stroke-linecap="round"/></g>
</defs></svg>
<div id="strip"></div>
<script>
// Squash around the feet so Nib breathes without lifting off the ground.
const squash = (sx, sy) => `translate(100,192) scale(${sx},${sy}) translate(-100,-192)`;
const frame = inner => `<svg class="frame" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,30)">${inner}</g></svg>`;
const wave = (i, n) => (1 - Math.cos(2 * Math.PI * i / n)) / 2;
const ANIMS = {
  idle: [...Array(8)].map((_, i) => {
    const b = wave(i, 8);
    const eyes = i === 5 ? 'eyes-blink' : 'eyes-open';
    return frame(`<use href="#feet"/><g transform="${squash(1 + 0.015 * b, 1 - 0.03 * b)}"><use href="#arms"/><use href="#body"/><use href="#${eyes}"/></g>`);
  }),
  sit: [...Array(4)].map((_, i) => {
    const b = wave(i, 4);
    return frame(`<g transform="${squash(1.04 + 0.01 * b, 0.92 - 0.02 * b)}"><use href="#sitfeet"/><use href="#body"/><use href="#eyes-happy"/><ellipse cx="62" cy="170" rx="12" ry="9" fill="#2b2a50" stroke="#15142a" stroke-width="3"/><ellipse cx="138" cy="170" rx="12" ry="9" fill="#2b2a50" stroke="#15142a" stroke-width="3"/></g>`);
  }),
  sleep: [...Array(4)].map((_, i) => {
    const b = wave(i, 4);
    const zy = 10 - i * 4;
    return frame(`<g transform="rotate(6 100 192) ${squash(1.06 + 0.02 * b, 0.86 - 0.03 * b)}"><use href="#feet"/><use href="#body"/><use href="#eyes-closed"/></g><text x="146" y="${zy + 20}" font-family="Arial" font-size="20" font-weight="700" fill="#7c7aa8" opacity="${0.4 + 0.15 * i}">z</text><text x="160" y="${zy}" font-family="Arial" font-size="26" font-weight="700" fill="#7c7aa8" opacity="${0.4 + 0.15 * i}">Z</text>`);
  }),
  dance: [...Array(8)].map((_, i) => {
    const side = i < 4 ? -1 : 1;
    const t = Math.sin(Math.PI * (i % 4) / 4);
    const tilt = side * 10 * t;
    const hop = -8 * t;
    const armUp = side < 0
      ? `<ellipse cx="38" cy="96" rx="10" ry="15" transform="rotate(-30 38 96)" fill="#2b2a50" stroke="#15142a" stroke-width="3"/><ellipse cx="160" cy="152" rx="10" ry="14" fill="#2b2a50" stroke="#15142a" stroke-width="3"/>`
      : `<ellipse cx="162" cy="96" rx="10" ry="15" transform="rotate(30 162 96)" fill="#2b2a50" stroke="#15142a" stroke-width="3"/><ellipse cx="40" cy="152" rx="10" ry="14" fill="#2b2a50" stroke="#15142a" stroke-width="3"/>`;
    return frame(`<g transform="translate(0,${hop}) rotate(${tilt} 100 192)"><use href="#feet"/>${armUp}<use href="#body"/><use href="#eyes-happy"/><path d="M92 140 Q100 148 108 140" fill="none" stroke="#7ff3ff" stroke-width="3" stroke-linecap="round"/></g>`);
  }),
};
const anim = new URLSearchParams(location.search).get('anim') || 'idle';
document.getElementById('strip').innerHTML = ANIMS[anim].join('');
</script>
</body></html>
