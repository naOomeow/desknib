[package]
name = "desknib"
version = "0.1.0"
edition = "2024"
description = "A quiet, lightweight desktop pet that turns notifications into chat bubbles"
license = "MIT"
repository = "https://github.com/naOomeow/desknib"

[dependencies]
ab_glyph = "0.2.32"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.11"
x11rb = { version = "0.13", features = ["shape", "image"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
